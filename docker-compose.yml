services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: taskflow
      POSTGRES_USER: taskflow
      POSTGRES_PASSWORD: taskflow
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskflow"]
      interval: 3s
      timeout: 3s
      retries: 10
    volumes:
      - taskflow-data:/var/lib/postgresql/data

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://taskflow:taskflow@database:5432/taskflow
      JWT_SECRET: local-docker-development-secret-change-me
    ports:
      - "8000:8000"
    depends_on:
      database:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  taskflow-data:

